# Plugin Manager description; Marketplace continues to use plugin.xml.
# Looked up by IntelliJ using plugin.<id>.description.
# suppress inspection "UnusedProperty"
plugin.slanglsp_r.description=<p><b>I didn't find any working slang lsps here</b>, so I just took one and added a lot of features that make it work</p>\
    <p>So this plugin gives you everything, code completion, syntax highlight, docs in popup, go-to-definition, find usages, rename, clang-format support, vcpkg-installed slang support etc</p>\
    <p>This is a refined fork of <a href="https://plugins.jetbrains.com/plugin/26239-slang-unofficial-">Slang [Unofficial]</a>, props to 16-Bit-Dog</p>\
    <br>\
    <p><b>Vcpkg's Slang package auto-discovery</b> is supported for CMake, MSBuild, XMake, Meson and default paths</p>

