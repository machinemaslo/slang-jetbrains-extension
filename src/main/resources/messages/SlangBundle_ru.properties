plugin.slanglsp_r.description=<p><b>Я не нашёл тут ни одного нормально работающего Slang LSP</b>, так что просто взял один и добавил кучу фич, чтобы всё заработало</p>\
    <p>Так что в этом плагине есть всё: автодополнение, подсветка синтаксиса, документация во всплывающем окне, переход к определению, поиск использований, переименование, поддержка clang-format, Slang из vcpkg и прочее</p>\
    <p>Это доработанный форк <a href="https://plugins.jetbrains.com/plugin/26239-slang-unofficial-">Slang [Unofficial]</a>, респект 16-Bit-Dog</p>\
    <br>\
    <p><b>Автоматический поиск пакета Slang из vcpkg</b> работает с CMake, MSBuild, XMake, Meson и стандартными путями</p>

