plugin.slanglsp_r.description=<p><b>我在这儿没找到能正常用的 Slang LSP</b>，所以就拿了一个，加了一堆功能，让它能好好工作</p>\
    <p>所以这个插件该有的都有了：代码补全、语法高亮、弹窗文档、跳转到定义、查找用法、重命名、clang-format 支持、通过 vcpkg 安装的 Slang 支持等等</p>\
    <p>这是 <a href="https://plugins.jetbrains.com/plugin/26239-slang-unofficial-">Slang [Unofficial]</a> 的改进版分支，感谢 16-Bit-Dog</p>\
    <br>\
    <p><b>自动查找 vcpkg 的 Slang 包</b>，支持 CMake、MSBuild、XMake、Meson 和默认路径</p>
